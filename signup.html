<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Create Account, Concerto</title>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://concertocity.com/signup.html" />
  <meta property="og:title" content="Create Account, Concerto" />
  <meta property="og:description" content="" />
  <meta property="og:image" content="https://concertocity.com/ConcertoSocialPreview.png" />
  <meta property="og:image:secure_url" content="https://concertocity.com/ConcertoSocialPreview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Concerto, from the concert to the city" />
  <meta property="og:site_name" content="Concerto" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://concertocity.com/signup.html" />
  <meta name="twitter:title" content="Create Account, Concerto" />
  <meta name="twitter:description" content="" />
  <meta name="twitter:image" content="https://concertocity.com/ConcertoSocialPreview.png" />
  <meta name="twitter:image:alt" content="Concerto, from the concert to the city" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root{--display:'Playfair Display',Georgia,serif;--body:'DM Sans',-apple-system,sans-serif;--bg:#F8F9F9;--card-bg:#FFFFFF;--text:#121E36;--text-dim:rgba(18,30,54,0.52);--text-xdim:rgba(18,30,54,0.28);--border:rgba(18,30,54,0.08);--border-mid:rgba(18,30,54,0.14);--gold:#C9A84C;--gold-light:#E5C365;--red:#E53E3E;--shadow-lg:0 20px 50px rgba(18,30,54,0.12);--ease-out:cubic-bezier(0.16,1,0.3,1);--radius-md:20px;--radius-lg:28px;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{font-family:var(--body);color:var(--text);background:var(--bg);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .bg-canvas{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
    .orb{position:absolute;border-radius:50%;filter:blur(120px);}
    .orb-1{width:60vw;height:60vw;background:radial-gradient(circle,rgba(192,192,192,0.2) 0%,transparent 70%);top:-20%;left:-10%;}
    .orb-2{width:40vw;height:40vw;background:radial-gradient(circle,rgba(201,168,76,0.10) 0%,transparent 70%);bottom:-10%;right:-5%;}
    .auth-card{width:100%;max-width:440px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2.8rem;box-shadow:var(--shadow-lg);}
    .auth-logo{text-align:center;margin-bottom:2.2rem;}
    .auth-logo img{height:40px;width:auto;margin:0 auto;}
    .auth-title{font-family:var(--display);font-size:1.9rem;font-weight:700;letter-spacing:-0.025em;color:var(--text);text-align:center;margin-bottom:0.5rem;}
    .auth-sub{font-size:0.88rem;color:var(--text-dim);text-align:center;margin-bottom:2.2rem;line-height:1.6;}
    .social-buttons{display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1.8rem;}
    .social-btn{display:flex;align-items:center;justify-content:center;gap:0.75rem;width:100%;padding:0.85rem 1.5rem;border-radius:99px;border:1.5px solid var(--border);background:var(--bg);font-family:var(--body);font-size:0.82rem;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.25s var(--ease-out);}
    .social-btn:hover{border-color:var(--border-mid);background:var(--card-bg);transform:translateY(-1px);}
    .divider{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;}
    .divider-line{flex:1;height:1px;background:var(--border);}
    .divider-text{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-xdim);}
    .form-group{margin-bottom:1.2rem;}
    .form-label{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-dim);margin-bottom:0.5rem;}
    .form-input{width:100%;padding:0.9rem 1.2rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-family:var(--body);font-size:0.95rem;color:var(--text);background:var(--bg);outline:none;transition:border-color 0.25s,box-shadow 0.25s;}
    .form-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.12);}
    .form-input::placeholder{color:var(--text-xdim);}
    .submit-btn{width:100%;padding:1rem;border-radius:99px;border:none;background:var(--text);color:var(--bg);font-family:var(--body);font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s var(--ease-out);box-shadow:0 6px 20px rgba(18,30,54,0.16);margin-top:0.4rem;}
    .submit-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,30,54,0.22);}
    .submit-btn:disabled{opacity:0.5;pointer-events:none;}
    .auth-switch{text-align:center;margin-top:1.8rem;font-size:0.85rem;color:var(--text-dim);}
    .auth-switch a{color:var(--gold);font-weight:600;margin-left:0.3rem;}
    .error-msg{background:rgba(229,62,62,0.08);border:1px solid rgba(229,62,62,0.2);border-radius:12px;padding:0.8rem 1rem;font-size:0.84rem;color:var(--red);margin-bottom:1.2rem;display:none;}
    .error-msg.show{display:block;}
    .success-msg{background:rgba(56,161,105,0.08);border:1px solid rgba(56,161,105,0.2);border-radius:12px;padding:0.8rem 1rem;font-size:0.84rem;color:#276749;margin-bottom:1.2rem;display:none;}
    .success-msg.show{display:block;}
    .terms-note{font-size:0.75rem;color:var(--text-xdim);text-align:center;margin-top:1.2rem;line-height:1.6;}
    .terms-note a{color:var(--text-dim);}
    @media(max-width:480px){.auth-card{padding:2.2rem 1.8rem;}}
  </style>

  <style id="nav10">.nav-center>a{padding:0 0.6rem !important;font-size:0.64rem !important;letter-spacing:0.05em !important;}@media(max-width:1366px){.nav-center{display:none !important;}.nav-hamburger{display:flex !important;}}</style>
  <style id="ios-fix">html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;}</style>
</head>
<body>
  <div class="bg-canvas" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <div class="auth-card">
    <div class="auth-logo"><a href="index.html"><img loading="lazy" decoding="async" src="logo.png" alt="Concerto" /></a></div>
    <h1 class="auth-title">Create your account.</h1>
    <p class="auth-sub">Save venues, follow tours, and unlock the full night out. Free forever.</p>

    <div class="social-buttons">
      <button class="social-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <button class="social-btn" id="appleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M12.26 0c.07.9-.26 1.8-.8 2.46-.53.67-1.4 1.18-2.26 1.12-.1-.86.27-1.74.8-2.36C10.57.57 11.47.07 12.26 0zM15.5 12.05c-.34.75-.5 1.09-.94 1.76-.61.93-1.47 2.09-2.54 2.1-.95.01-1.2-.61-2.49-.6-1.29.01-1.56.62-2.52.61-1.06-.01-1.87-1.06-2.48-1.99C3.09 11.6 2.77 8.88 3.76 7.17c.7-1.22 1.96-1.94 3.13-1.94 1.17 0 1.9.62 2.87.62.93 0 1.5-.63 2.84-.63 1.04 0 2.15.57 2.86 1.54-.75.44-2.03 1.28-1.96 2.94.07 1.85 1.6 2.77 2 2.35z"/></svg>
        Continue with Apple
      </button>
    </div>

    <div class="divider"><div class="divider-line"></div><span class="divider-text">or</span><div class="divider-line"></div></div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label" for="name">Your Name</label>
        <input class="form-input" type="text" id="name" placeholder="Jayce Wells" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Create Account, Free</button>
    </form>

    <p class="terms-note">By creating an account you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    <p class="auth-switch">Already have an account?<a href="login.html">Sign in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    getCurrentUser().then(user => { if (user) window.location.href = 'account.html'; });

    function showError(msg) { const el=document.getElementById('errorMsg'); el.textContent=msg; el.classList.add('show'); document.getElementById('successMsg').classList.remove('show'); }
    function showSuccess(msg) { const el=document.getElementById('successMsg'); el.textContent=msg; el.classList.add('show'); document.getElementById('errorMsg').classList.remove('show'); }

    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating account…';
      const { data, error } = await signUp(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value,
        document.getElementById('name').value.trim()
      );
      if (error) { showError(error.message); btn.disabled=false; btn.textContent='Create Account, Free'; }
      else if (data.user && !data.session) {
        showSuccess('Check your email to confirm your account, then sign in.');
        btn.textContent = 'Email sent!';
      } else {
        window.location.href = 'account.html';
      }
    });

    document.getElementById('googleBtn').addEventListener('click', signInWithGoogle);
    document.getElementById('appleBtn').addEventListener('click', signInWithApple);
  </script>

  
  <script src="app-shell.js"></script>
</body>
</html>
