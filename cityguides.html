  <style>
    /* ─── EXACT BRAND PALETTE ─── */
    :root {
      --bg: #F8F9F9; 
      --card-bg: #FFFFFF;
      --text: #121E36; 
      --text-dim: rgba(18, 30, 54, 0.55);
      --border: #C0C0C0; 
      --border-light: rgba(18, 30, 54, 0.08);
      --shadow-btn: 0 8px 28px rgba(18, 30, 54, 0.18);
      --transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      font-family: 'DM Sans', sans-serif; color: var(--text); overflow-x: hidden;
      line-height: 1.6; -webkit-font-smoothing: antialiased; background: var(--bg);
    }

    /* ─── AMBIENT BACKGROUND ─── */
    .bg-canvas { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; transition: transform 0.1s linear; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
    .orb-1 { width: 60vw; height: 60vw; background: rgba(192, 192, 192, 0.4); top: -20%; left: -10%; }
    .orb-2 { width: 50vw; height: 50vw; background: rgba(248, 249, 249, 0.8); bottom: -10%; right: -10%; }

    /* ─── TYPOGRAPHY & BUTTONS ─── */
    h1, h2, h3, h4, .serif { font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: -0.01em; }
    .eyebrow { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 1.5rem; display: block; }
    
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 1rem 2.5rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; text-decoration: none;
      border-radius: 20px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-btn);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(18, 30, 54, 0.24); }

    /* ─── NAVIGATION ─── */
    nav { position: fixed; top: 0; width: 100%; padding: 2rem 5%; display: flex; align-items: center; justify-content: space-between; z-index: 1000; transition: var(--transition); }
    nav.scrolled { padding: 1.2rem 5%; background: rgba(248, 249, 249, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-light); }
    .logo { text-decoration: none; display: flex; align-items: center; flex: 1; }
    .nav-logo-img { height: 7rem; width: auto; object-fit: contain; }
    .nav-links { display: flex; align-items: center; justify-content: center; gap: 2.5rem; flex: 2; }
    .nav-links a { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); text-decoration: none; transition: color 0.3s; }
    .nav-links a:hover { color: var(--text); }
    .nav-action { flex: 1; display: flex; justify-content: flex-end; }
    .nav-action .btn-nav { padding: 0.6rem 1.5rem; font-size: 0.7rem; width: auto; }

    /* ─── HERO ─── */
    .hero { min-height: 45vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding: 160px 5% 40px; }
    .hero-title { font-size: clamp(3rem, 6vw, 4.5rem); letter-spacing: -0.02em; line-height: 1; margin-bottom: 1.5rem; }
    .hero-desc { font-size: clamp(1.05rem, 2vw, 1.15rem); color: var(--text-dim); max-width: 600px; margin: 0 auto; }

    /* ─── DIRECTORY UI ─── */
    .directory-container { max-width: 900px; margin: 0 auto; padding: 0 5% 120px; }
    
    .search-wrapper { position: relative; margin-bottom: 3rem; }
    .search-input {
      width: 100%; padding: 1.5rem 2rem; border-radius: 20px; border: 1px solid var(--border-light);
      background: var(--card-bg); font-family: 'DM Sans', sans-serif; font-size: 1.1rem; color: var(--text);
      outline: none; transition: border-color 0.3s, box-shadow 0.3s; box-shadow: 0 4px 20px rgba(18, 30, 54, 0.04);
    }
    .search-input:focus { border-color: var(--text); box-shadow: 0 8px 30px rgba(18, 30, 54, 0.08); }
    .search-input::placeholder { color: rgba(18, 30, 54, 0.3); }

    .venue-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    
    .venue-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px;
      text-decoration: none; color: var(--text); transition: all 0.2s ease;
    }
    .venue-link:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(18, 30, 54, 0.06); border-color: var(--text); }
    
    .v-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; display: block; margin-bottom: 0.2rem; }
    .v-action { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
    .venue-link:hover .v-action { color: var(--text); }

    .no-results { grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-dim); font-size: 1.1rem; }

    /* ─── FOOTER ─── */
    footer { border-top: 1px solid var(--border-light); padding: 4rem 5%; background: var(--bg); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2rem; }
    .footer-logo-img { height: 3.5rem; width: auto; opacity: 0.8; }
    .footer-links a { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); text-decoration: none; margin-left: 3rem; transition: color 0.3s; }
    .footer-links a:hover { color: var(--text); }

    @media (max-width: 960px) { .nav-links { display: none; } }
    @media (max-width: 768px) {
      .footer-links a { margin-left: 0; margin-right: 2rem; display: inline-block; margin-bottom: 1rem; }
      .nav-logo-img { height: 5rem; }
      .venue-list { grid-template-columns: 1fr; }
    }
  </style>
</head>

      { name: "Essence Festival of Culture", url: "https://concerto-venue-map.netlify.app/essencefestivalofculture" },
      { name: "SXSW (Music, Film & Interactive)", url: "https://concerto-venue-map.netlify.app/sxswmusicfilmandinteractive" },
      { name: "CMA Fest", url: "https://concerto-venue-map.netlify.app/cmafest" },
      { name: "Made in America", url: "https://concerto-venue-map.netlify.app/madeinamerica" },
      { name: "Radio City Music Hall", url: "https://concerto-venue-map.netlify.app/radiocitymusichall" },
      { name: "The Star", url: "https://concerto-venue-map.netlify.app/thestar" },
      { name: "The Gorge Amphitheatre", url: "https://concerto-venue-map.netlify.app/thegorgeamphitheatre" }
    ];

    const venueListEl = document.getElementById('venueList');
    const searchInput = document.getElementById('searchInput');

    // Render the links
    function renderList(items) {
      venueListEl.innerHTML = '';
      
      if (items.length === 0) {
        venueListEl.innerHTML = '<div class="no-results">No venues found. Try a different search.</div>';
        return;
      }

      items.forEach(item => {
        const linkEl = document.createElement('a');
        linkEl.className = 'venue-link';
        linkEl.href = item.url;
        linkEl.target = '_blank'; // Opens your specific Netlify app in a new tab
        
        linkEl.innerHTML = `
          <span class="v-name">${item.name}</span>
          <span class="v-action">View Guide &rarr;</span>
        `;
        venueListEl.appendChild(linkEl);
      });
    }

    // Initial render
    renderList(venues);

    // Search filtering
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = venues.filter(item => item.name.toLowerCase().includes(term));
      renderList(filtered);
    });

  </script>
</body>
</html>
