<form action="/partners-thank-you" class="partner-form" data-netlify="true" method="POST" name="partner-artists-interest" netlify-honeypot="bot-field">
<input name="form-name" type="hidden" value="partner-artists-interest"><input name="partner_type" type="hidden" value="Artists &amp; tours"><p class="hidden-field"><label>Leave blank <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
<div class="form-grid"><label class="field"><span>Organization *</span><input name="organization" autocomplete="organization" required maxlength="160"></label><label class="field"><span>Your name *</span><input name="contact_name" autocomplete="name" required maxlength="100"></label><label class="field"><span>Email *</span><input name="email" autocomplete="email" type="email" required></label><label class="field"><span>Official artist or tour website</span><input name="website" type="url" placeholder="https://"></label><label class="field full"><span>Artist, tour, and relevant markets *</span><input name="market" required maxlength="240"></label><label class="field full"><span>What would you like to explore? *</span><textarea name="notes" rows="4" required maxlength="2000" placeholder="Your idea, timing, and what would make it worthwhile."></textarea></label></div>
<label class="consent"><input name="agreement" type="checkbox" required><span>I understand this is an inquiry, not a confirmed partnership or placement.</span></label><button class="btn-primary" type="submit">Send partnership inquiry</button><p class="form-note">Please do not include confidential account details. See our <a href="/privacy">Privacy Policy</a>.</p></form>
