name: Rebuild data

# Edit data/venues.json, data/venue_info.json, data/tours.json or
# setlists.json in the GitHub web editor, hit Commit, and this runs.
# It regenerates search-index.json and sitemap.xml, validates
# everything, and commits the result. Netlify then deploys, and the
# app picks the new data up on its next fetch: no App Store update.
#
# If validation fails, the commit is left alone and the run goes red.
# Check the Actions tab for what went wrong.

on:
  push:
    branches: [main]
    paths:
      - 'data/venues.json'
      - 'data/venue_info.json'
      - 'data/tours.json'
      - 'setlists.json'
      - 'build_data.py'
      - 'build_sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate derived files and validate
        run: python3 build_data.py

      - name: Rebuild sitemap
        run: python3 build_sitemap.py

      - name: Commit if anything changed
        run: |
          git config user.name "concerto-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Rebuild derived data [skip ci]"
            git push
          else
            echo "Derived files already up to date."
          fi
