[functions]
  directory = "netlify/functions"
  # alerts-poll-background.js reads data/tours.json at runtime via fs.readFileSync
  # for the zero-results check. Netlify's bundler only packages a
  # function's own code and npm dependencies by default -- it won't
  # include a sibling data file just because the code references it
  # at runtime, so this has to be explicit or the file silently won't
  # exist in the deployed function.
  included_files = ["data/tours.json", "data/venue_info.json"]

[build.environment]
  # Google Maps browser keys are referrer-restricted and must ship to the client,
  # so they are not real secrets. Tell Netlify's scanner to skip them.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_MAPS_API_KEY,GOOGLE_MAPS_BROWSER_KEY,SUPABASE_URL"

# City guide SPA retired. Venue pages carry the guide now.
# NOTE: _redirects is authoritative and has a per-slug cityguide map;
# these are kept only as a mirror of the fallback behaviour.
[[redirects]]
  from = "/cityguide/*"
  to = "/venue/:splat"
  status = 301

[[redirects]]
  from = "/cityguides"
  to = "/venues"
  status = 301

[[redirects]]
  from = "/tours/fifa-world-cup-2026"
  to = "/tours"
  status = 301

# Onsale alerts: polls Ticketmaster every 6 hours for new tour dates
# (followed artists) and presale timing (already-saved shows).
# Defaults to a dry run (see ALERTS_DRY_RUN in the function itself)
# until you're ready to have it actually send.
#
# Runs as a Background Function (the -background filename suffix,
# not a config here), which is what gives it up to 15 minutes instead
# of the ~30-second ceiling a standard function hit on its first real
# run. The schedule config still applies the same way regardless.
[functions."alerts-poll-background"]
  schedule = "0 */6 * * *"
